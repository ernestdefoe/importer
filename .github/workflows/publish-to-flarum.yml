name: Post release to Flarum support site

on:
  release:
    types: [published]
  # Manual / force-repost: pick a tag (or leave blank to take the latest
  # published release on the repo). The workflow resolves the release
  # via the API, so it works the same for both triggers.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to post (leave blank to use the latest published release).'
        required: false
        type: string

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # Resolve the release once. This makes the rest of the workflow
      # independent of the trigger — it reads RELEASE_TAG / RELEASE_BODY
      # / RELEASE_URL / RELEASE_NAME from $GITHUB_ENV regardless of how
      # the run was started.
      - name: Resolve release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            release_json=$(gh api "repos/${GH_REPO}/releases/latest")
          else
            release_json=$(gh api "repos/${GH_REPO}/releases/tags/${tag}")
          fi

          echo "RELEASE_TAG=$(echo "$release_json" | jq -r '.tag_name')"   >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$(echo "$release_json" | jq -r '.name // .tag_name')" >> "$GITHUB_ENV"
          echo "RELEASE_URL=$(echo "$release_json" | jq -r '.html_url')"  >> "$GITHUB_ENV"

          delim="EOF_$(openssl rand -hex 8)"
          {
            printf 'RELEASE_BODY<<%s\n' "$delim"
            echo "$release_json" | jq -r '.body // ""'
            printf '%s\n' "$delim"
          } >> "$GITHUB_ENV"

      # Build a usable changelog. If the release body has real content,
      # use it as-is. If it's empty or one of the known release-drafter
      # placeholders ("No changes", "No changes made.", a lone
      # "Full Changelog" link, etc.), fall back to enumerating commits
      # between the previous tag and this one via the compare API.
      - name: Build changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          stripped=$(printf '%s\n' "${RELEASE_BODY:-}" \
            | sed -E '/^\s*$/d' \
            | sed -E '/^##[[:space:]]+What.s Changed[[:space:]]*$/Id' \
            | sed -E '/^\*[[:space:]]*No changes[[:space:]]*$/Id' \
            | sed -E '/^No changes( made)?\.?[[:space:]]*$/Id' \
            | sed -E '/^\*\*Full Changelog\*\*:.*/d' \
            | sed -E '/^Full Changelog:.*/d')

          if [ -n "$stripped" ]; then
            echo "Release body has content — using it as-is."
            body="$RELEASE_BODY"
          else
            echo "Release body is empty/placeholder — building from commits."

            previous_tag=$(gh api "repos/${GH_REPO}/tags?per_page=100" \
              --jq '[.[] | select(.name != env.RELEASE_TAG) | .name][0] // empty')

            if [ -z "$previous_tag" ]; then
              echo "No previous tag — treating as initial release."
              body="_Initial release._"
            else
              echo "Comparing ${previous_tag}...${RELEASE_TAG}"
              changelog=$(gh api --paginate \
                "repos/${GH_REPO}/compare/${previous_tag}...${RELEASE_TAG}" \
                --jq '[.commits[]
                       | select((.parents | length) < 2)
                       | "- " + (.commit.message | split("\n")[0])
                      ] | .[:60] | join("\n")')

              if [ -z "$changelog" ]; then
                body="_No commits between ${previous_tag} and ${RELEASE_TAG}._"
              else
                body=$(printf '## What'"'"'s Changed\n\n%s\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                  "$changelog" "$GH_REPO" "$previous_tag" "$RELEASE_TAG")
              fi
            fi
          fi

          delim="EOF_$(openssl rand -hex 8)"
          {
            printf 'body<<%s\n' "$delim"
            printf '%s\n' "$body"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      # 🚨 A post mention, @"Name"#p123, only means anything on the forum the
      # post is on: copied to the other forum it is raw text, or a mention of
      # whatever unrelated post has that id there (Secret Santa 1.0.2 thanked a
      # deleted Discuss post). So release notes say which forum a thanked post
      # lives on, "#p123" for discuss.flarum.org and "#e123" for the support
      # site, and each forum gets its own copy of the notes:
      #   - on the post's own forum, the real post mention;
      #   - on the other, a mention of the same person's account there, from
      #     the shared map (ernestdefoe/.github people.json, keyed by the
      #     post's author), else their name; either way followed by a link to
      #     the report ("on the support site" / "on Discuss"), so readers
      #     see where reports are made.
      - name: Thank reporters on each forum
        id: thanks
        env:
          POST_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 -o /tmp/people.json https://raw.githubusercontent.com/ernestdefoe/.github/main/people.json \
            || { echo "::warning::people.json could not be fetched; thanks fall back to a name and a link."; echo '{"people":[]}' > /tmp/people.json; }
          python3 - <<'PY'
          import json, os, re, secrets, urllib.request

          FORUMS = {
              "discuss": ("https://discuss.flarum.org", "on Discuss"),
              "edonline": ("https://ernestdefoe.online", "on the support site"),
          }

          def get(url):
              req = urllib.request.Request(url, headers={"Accept": "application/vnd.api+json", "User-Agent": "publish-to-flarum"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.load(r)

          def post_info(forum, pid):
              try:
                  doc = get(f"{FORUMS[forum][0]}/api/posts/{pid}?include=user,discussion")
              except Exception as e:
                  print(f"::warning title=Thanks line::{forum} post {pid} could not be read ({e}); it is thanked by name only.")
                  return None
              inc = {(i["type"], i["id"]): i["attributes"] for i in doc.get("included", [])}
              rel = doc["data"].get("relationships", {})
              uid = ((rel.get("user") or {}).get("data") or {}).get("id")
              did = ((rel.get("discussion") or {}).get("data") or {}).get("id")
              return {
                  "user_id": int(uid) if uid else None,
                  "username": inc.get(("users", uid), {}).get("username"),
                  "url": f"{FORUMS[forum][0]}/d/{inc.get(('discussions', did), {}).get('slug') or did}/{doc['data']['attributes']['number']}",
              }

          with open(os.environ.get("PEOPLE_FILE", "/tmp/people.json")) as f:
              people = json.load(f).get("people", [])

          def person(forum, info, name):
              # The post's author is the reliable key; the name in the notes is the fallback.
              for p in people:
                  acct = p.get(forum) or {}
                  if info and info["user_id"] and acct.get("id") == info["user_id"]:
                      return p
              for p in people:
                  if any((p.get(f) or {}).get("username", "").lower() == name.lower() for f in FORUMS):
                      return p
              return None

          cache = {}
          def mention(m, target):
              name, kind, pid = m.group(1), m.group(2), m.group(3)
              home = "discuss" if kind == "p" else "edonline"
              if target == home:
                  return f'@"{name}"#p{pid}'
              if (home, pid) not in cache:
                  info = post_info(home, pid)
                  p = person(home, info, name)
                  names = {(a or {}).get("username", "").lower() for a in (p or {}).values()}
                  if info and info["username"] and name.lower() not in names | {info["username"].lower()}:
                      print(f'::warning title=Thanks line::{home} post {pid} is by {info["username"]}, not {name}. Is the id from the other forum?')
                  cache[(home, pid)] = (info, p)
              info, p = cache[(home, pid)]
              acct = (p or {}).get(target)
              who = f'@"{acct["username"]}"#{acct["id"]}' if acct else name
              # The link stays even with a mention: it shows where the report was made.
              return f'{who} ([{FORUMS[home][1]}]({info["url"]}))' if info else who

          MENTION = re.compile(r'@"([^"\n]+)"#([pe])(\d+)')
          body = os.environ.get("POST_BODY", "")
          out = {t: MENTION.sub(lambda m: mention(m, t), body) for t in ("edonline", "discuss")}

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for key, t in (("support", "edonline"), ("discuss", "discuss")):
                  d = "EOF_" + secrets.token_hex(8)
                  f.write(f"{key}<<{d}\n{out[t]}\n{d}\n")
          PY

      - name: Post reply to support discussion
        env:
          GH_TOKEN: ${{ github.token }}
          FLARUM_FORUM_URL: ${{ vars.FLARUM_FORUM_URL }}
          FLARUM_DISCUSSION_ID: ${{ vars.FLARUM_DISCUSSION_ID }}
          FLARUM_API_KEY: ${{ secrets.FLARUM_API_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
          POST_BODY: ${{ steps.thanks.outputs.support }}
        run: |
          set -euo pipefail

          # 🚨 Skip, do not fail, when the announcement is not configured.
          # A repository with no support discussion is a normal state — a new
          # extension, a private one, one that simply is not announced. Exiting
          # 1 painted a red X on every release of every such repo, which trains
          # people to ignore the one failure that does matter.
          if [ -z "${FLARUM_FORUM_URL}" ] || [ -z "${FLARUM_DISCUSSION_ID}" ] || [ -z "${FLARUM_API_KEY}" ]; then
            echo "::notice::No support discussion configured for this repository — skipping the announcement. Set the FLARUM_FORUM_URL and FLARUM_DISCUSSION_ID variables and the FLARUM_API_KEY secret to enable it."
            exit 0
          fi

          # 🚨 A "#12" in release notes is never this forum's discussion 12.
          #
          # It is a GitHub issue or pull request (release-drafter appends
          # "(#12)"), a post in a discuss.flarum.org thread ("Discuss d/40107
          # #94"), or a post in one of this forum's threads ("d/98 #30"). The
          # support site runs cross-references, which reads every bare "#12"
          # as ITS discussion 12: Curio 1.18.1 linked "Marginalia" and left a
          # backlink there. So each one becomes what it means before the
          # render, in one pass so a link made here is never rewritten again
          # (a link's text is not parsed for cross-references). A private
          # repo's issues are a 404 for readers, so there the number goes.
          POST_BODY=$(printf '%s\n' "${POST_BODY:-}" | PRIVATE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private 2>/dev/null || echo true)" perl -pe '
            BEGIN { $r = $ENV{GITHUB_REPOSITORY}; $p = $ENV{PRIVATE} ne "false"; }
            if (/^\s*(```|~~~)/) { $f = !$f; next; }
            next if $f;
            $_ = join "", map {
              /^`/ ? $_ : do {
                s{\bd/(\d+)(?:/| #)(\d+)|(?<![\w/&\[#"])#(\d+)\b(?!/p)}{
                  defined $1
                    ? ($1 >= 10000 ? "[d/$1 #$2](https://discuss.flarum.org/d/$1/$2)" : "#$1/p$2")
                    : ($p ? "" : "[#$3](https://github.com/$r/issues/$3)")
                }ge;
                s/\s*\(\s*\)//g;
                $_;
              }
            } split /(`[^`\n]*`)/, $_;
          ')

          CONTENT_MD=$(printf '## %s %s\n\n%s\n\n[View release on GitHub](%s)\n\n☕ If you like the things I have built, consider [buying me a coffee](https://buymeacoffee.com/ernestdefoe).\n' \
            "$REPO_NAME" "$RELEASE_TAG" "${POST_BODY:-_No release notes provided._}" "$RELEASE_URL")
          # Private repo: its GitHub release page 404s for everyone else, so leave the link out.
          if [ "${{ github.event.repository.private }}" = "true" ]; then CONTENT_MD=$(printf '%s\n' "$CONTENT_MD" | grep -v 'on GitHub](' || true); fi

          # 🚨 Render to HTML before posting. Release notes are Markdown, and the
          # support site has no Markdown extension — Scribe replaced it — so
          # posting the raw source published literal "##" and "**bold**" as the
          # announcement body. GitHub's own /markdown endpoint is used because it
          # is already authenticated here, needs nothing installed, and renders
          # the same GFM the release page shows.
          #
          # Falls back to the Markdown source if the render fails: a slightly
          # ugly announcement beats no announcement.
          #
          # 🚨 Two attempts, then a LOUD fallback.
          #
          # This used to discard stderr and fall back silently, so a failed
          # render published literal "##" and "**bold**" to the support site
          # with nothing anywhere saying it had happened — page-builder 3.5.0
          # is still sitting there like that. A fallback nobody can see is
          # indistinguishable from working, which is how it survived.
          #
          # The retry is because the failure is intermittent: the same release
          # notes rendered fine on other repos the same week.
          CONTENT=""
          for attempt in 1 2; do
            if CONTENT=$(jq -n --arg text "$CONTENT_MD" '{text:$text, mode:"markdown"}' \
                 | gh api --method POST /markdown --input - 2>/tmp/md-render-err.txt) \
               && [ -n "$CONTENT" ]; then
              break
            fi
            CONTENT=""
            if [ "$attempt" = "1" ]; then sleep 3; fi
          done

          if [ -z "$CONTENT" ]; then
            # Still posted, because a rough announcement beats none — but the run
            # is now marked so somebody can go and fix the post.
            echo "::warning title=Markdown render failed::Posting the Markdown SOURCE, which this site does not render — the announcement will contain literal ## and **. $(head -c 300 /tmp/md-render-err.txt 2>/dev/null | tr -s '[:space:]' ' ')"
            CONTENT="$CONTENT_MD"
          fi

          # 🚨 <tt> is not in Scribe's allowed vocabulary, so the site ESCAPES it
          # and the announcement shows a literal "&lt;tt&gt;" to every reader.
          # GitHub's GFM renderer emits it unprompted: a bare compare URL is
          # autolinked as <a class="commit-link">owner/repo@<tt>a...b</tt></a>,
          # which is exactly the "Full Changelog" line release notes end with.
          # <code> renders identically and is allowed.
          # 🚨 Three more cases of the very same problem, every one of them
          # seen in a published post. GitHub also wraps fenced code blocks in
          # <div class="highlight..."> and tables in
          # <markdown-accessiblity-table> (their spelling of "accessibility",
          # so match it exactly), and it escapes `<script>` to &lt;script&gt;
          # inside <code> — which Flarum then escapes AGAIN, so the reader is
          # shown the entity instead of the tag. Send the literal characters
          # and let Flarum escape them exactly once.
          #
          # 🚨 The captures are copied into lexicals before the inner
          # substitutions run. Those substitutions reset $1, so building the
          # replacement straight from $1 silently drops the opening <code>
          # tag and leaves a stray </code> behind in the prose.
          CONTENT=$(printf '%s' "$CONTENT" | perl -0777 -pe '
            s|<tt>|<code>|g;
            s|</tt>|</code>|g;
            s|<div class="highlight[^"]*">\s*||g;
            s|</pre>\s*</div>|</pre>|g;
            s|</?markdown-accessiblity-table>||g;
            #
            # 🚨 A HEADING posts its permalink furniture as visible text.
            #
            # In "markdown" mode GitHub wraps every heading like this:
            #   <div class="markdown-heading"><h2 class="heading-element">T</h2>
            #   <a class="anchor"><span class="octicon octicon-link"></span></a></div>
            #
            # Flarum allows the heading and nothing else there, so it escapes
            # the div, the anchor and the span, and the reader is shown the
            # markup instead of a title. Keep the heading, drop the furniture.
            s{<div class="markdown-heading">(.*?)</div>}{
              my $h = $1;
              $h =~ s{<a[^>]*class="anchor".*?</a>}{}gs;
              $h =~ s{ class="heading-element"}{}g;
              $h;
            }ges;
            #
            # 🚨 A FENCED CODE BLOCK posts its own wrapper as visible text.
            #
            # Flarum renders <pre> and supplies its OWN <code>, escaping
            # everything else inside it. GitHub emits a fence two ways, and
            # BOTH leave tags inside the <pre> that the reader then sees as
            # literal markup:
            #
            #   ```          -> <pre class="notranslate"><code class="notranslate">TEXT</code></pre>
            #   ```php       -> <div class="highlight..."><pre class="notranslate"><span class="pl-s1">TEXT</span></pre></div>
            #
            # The plain form published a literal <code class="notranslate">
            # line above the code and </code> below it — social-groups v2.5.0
            # went out like that. The highlighted form is worse: every syntax
            # <span> is shown as source, burying the code in markup. Nobody had
            # hit that one only because no release notes had used a
            # language-tagged fence yet.
            #
            # So reduce every fence to <pre>TEXT</pre> and let Flarum wrap it.
            # Entities are unescaped exactly once here, because Flarum escapes
            # what it is given — the same reason the <code> rule below does it.
            # Highlighting still happens: Flarum loads hljs client-side.
            #
            # Must run BEFORE the inline-<code> rule, whose non-greedy
            # match pairs an opening <code> inside a <pre> with a closing tag
            # outside it.
            s{<pre[^>]*>(.*?)</pre>}{
              my $inner = $1;
              $inner =~ s{</?code[^>]*>}{}g;
              $inner =~ s{</?span[^>]*>}{}g;
              $inner =~ s{&lt;}{<}g;
              $inner =~ s{&gt;}{>}g;
              $inner =~ s{&amp;}{&}g;
              "<pre>" . $inner . "</pre>";
            }ges;
            s{(<code[^>]*>)(.*?)</code>}{
              my ($open, $inner) = ($1, $2);
              $inner =~ s{&lt;}{<}g;
              $inner =~ s{&gt;}{>}g;
              $inner =~ s{&amp;}{&}g;
              $open . $inner . "</code>";
            }ges;
            s|&amp;|&|g;
            #
            # 🚨 Flarum makes its OWN <br> from any newline inside a block.
            #
            # The renderer pretty-prints, so a wrapped paragraph arrives as
            # several lines and Flarum turned every one of those into a visible
            # line break. Hand it one line per block. Newlines inside <pre> are
            # content, so they are kept.
            s{(<pre.*?</pre>)|\n+}{ defined $1 ? $1 : " " }ges;
          ')

          # 🚨 A rerun of this job must not post the release twice. If one of
          # the thread's latest posts already opens with this release's
          # heading, there is nothing left to do here.
          seen=$(curl -fsS --max-time 20 -G "${FLARUM_FORUM_URL%/}/api/posts" \
              -H "Authorization: Token ${FLARUM_API_KEY}" \
              --data-urlencode "filter[discussion]=${FLARUM_DISCUSSION_ID}" \
              --data-urlencode "sort=-createdAt" --data-urlencode "page[limit]=20" \
            | jq -r --arg tag "$RELEASE_TAG" '[.data[]? | (.attributes.contentHtml // "") | (capture("^\\s*<h2[^>]*>(?<t>[^<]*)</h2>").t)? | split(" ") | select(index($tag) or index($tag | ltrimstr("v")))] | length' 2>/dev/null) || seen=""
          if [ -z "$seen" ]; then
            echo "::warning::Could not read the support discussion to check for an earlier post of $RELEASE_TAG, so posting it."
          elif [ "$seen" -gt 0 ]; then
            echo "::notice::$RELEASE_TAG is already in the support discussion, so it is not posted again."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg content "$CONTENT" \
            --arg did "$FLARUM_DISCUSSION_ID" \
            '{data:{type:"posts",attributes:{content:$content},relationships:{discussion:{data:{type:"discussions",id:$did}}}}}')

          HTTP_CODE=$(curl -sS -o /tmp/flarum-resp.json -w '%{http_code}' \
            -X POST "${FLARUM_FORUM_URL%/}/api/posts" \
            -H "Authorization: Token ${FLARUM_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Flarum responded with HTTP $HTTP_CODE"
          # 🚨 Never print the response body. The key is an admin's, so the
          # body carries admin-only fields (the bot account's email), and the
          # log of a public repository is readable by anyone.
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            jq -c '{post: .data.id, number: .data.attributes.number, approved: .data.attributes.isApproved}' /tmp/flarum-resp.json 2>/dev/null || true
          else
            jq -c '[.errors[]? | {status, code, detail}]' /tmp/flarum-resp.json 2>/dev/null || echo "The response was not JSON."
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi

      # 🚨 The same release notes, as Markdown, in the extension's thread on
      # discuss.flarum.org — so people following it there see each release
      # without anyone posting by hand. Independent of the support-site post
      # above: it runs even if that one failed, and it skips quietly on a
      # repository with no thread mapped (DISCUSS_DISCUSSION_ID variable,
      # DISCUSS_FLARUM_TOKEN secret: a developer token for Ernest's account).
      - name: Post reply to discuss.flarum.org thread
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISCUSS_DISCUSSION_ID: ${{ vars.DISCUSS_DISCUSSION_ID }}
          DISCUSS_FLARUM_TOKEN: ${{ secrets.DISCUSS_FLARUM_TOKEN }}
          DISCUSS_URL: https://discuss.flarum.org
          POST_BODY: ${{ steps.thanks.outputs.discuss }}
        run: |
          set -euo pipefail

          if [ -z "${DISCUSS_DISCUSSION_ID}" ] || [ -z "${DISCUSS_FLARUM_TOKEN}" ]; then
            echo "::notice::No discuss.flarum.org thread configured for this repository — skipping."
            exit 0
          fi

          # Never post a release this run could not resolve.
          if [ -z "${RELEASE_TAG:-}" ] || [ -z "${RELEASE_URL:-}" ]; then
            echo "::error::The release was not resolved, so nothing was posted to discuss.flarum.org."
            exit 1
          fi

          # "Waymark 1.5.0 — a full trail on profiles": the extension's own
          # title in front of a release name that starts with its version.
          ext_title() {
            gh api "repos/${GH_REPO}/contents/composer.json$1" --jq '.content' 2>/dev/null \
              | base64 -d 2>/dev/null | jq -r '.extra["flarum-extension"].title // empty' 2>/dev/null || true
          }
          title=$(ext_title "?ref=${RELEASE_TAG}")
          title="${title:-$(ext_title "")}"
          title="${title:-${GH_REPO#*/}}"
          name="${RELEASE_NAME:-$RELEASE_TAG}"
          case "$name" in
            [vV0-9]*) heading="$title $name" ;;
            *) heading="$name" ;;
          esac

          notes="${POST_BODY:-_No release notes provided._}"

          # Release notes usually open with their own "## tagline", which the
          # heading above already says: drop a first heading the name contains.
          first=$(printf '%s\n' "$notes" | sed -n '/[^[:space:]]/{p;q;}')
          first_text=$(printf '%s' "$first" | sed -E 's/^#+[[:space:]]+//; s/[[:space:]]+$//')
          if [ "$first" != "$first_text" ] && [ -n "$first_text" ] \
             && printf '%s' "$name" | grep -qiF -- "$first_text"; then
            notes=$(printf '%s\n' "$notes" | awk -v f="$first" 'done || $0 != f { print; next } { done = 1 }')
          fi

          # The release's own headings, shifted so the highest of them sits
          # one level under the heading above (###). Discuss renders Markdown,
          # so the notes are otherwise posted as they are, leading blank
          # lines trimmed.
          notes=$(printf '%s\n' "$notes" | awk '
            { lines[NR] = $0; if (match($0, /^#+ /)) { l = RLENGTH - 1; if (!min || l < min) min = l } }
            END {
              started = 0
              for (i = 1; i <= NR; i++) {
                line = lines[i]
                if (!started && line ~ /^[[:space:]]*$/) continue
                started = 1
                if (min && match(line, /^#+ /)) {
                  n = RLENGTH - 1 - min + 3; if (n > 6) n = 6
                  h = ""; for (j = 0; j < n; j++) h = h "#"
                  line = h " " substr(line, RLENGTH + 1)
                }
                print line
              }
            }')
          CONTENT=$(printf '## %s\n\n%s\n\n[Release on GitHub](%s)\n\n☕ If you like the things I have built, consider [buying me a coffee](https://buymeacoffee.com/ernestdefoe).\n' "$heading" "$notes" "$RELEASE_URL")
          # Private repo: its GitHub release page 404s for everyone else, so leave the link out.
          if [ "${{ github.event.repository.private }}" = "true" ]; then CONTENT=$(printf '%s\n' "$CONTENT" | grep -v 'on GitHub](' || true); fi

          # 🚨 A rerun of this job must not post the release twice. If one of
          # the thread's latest posts already opens with this release's
          # heading, there is nothing left to do here.
          seen=$(curl -fsS --max-time 20 -G "${DISCUSS_URL%/}/api/posts" \
              -H "Authorization: Token ${DISCUSS_FLARUM_TOKEN}" \
              --data-urlencode "filter[discussion]=${DISCUSS_DISCUSSION_ID}" \
              --data-urlencode "sort=-createdAt" --data-urlencode "page[limit]=20" \
            | jq -r --arg tag "$RELEASE_TAG" '[.data[]? | (.attributes.contentHtml // "") | (capture("^\\s*<h2[^>]*>(?<t>[^<]*)</h2>").t)? | split(" ") | select(index($tag) or index($tag | ltrimstr("v")))] | length' 2>/dev/null) || seen=""
          if [ -z "$seen" ]; then
            echo "::warning::Could not read the discuss.flarum.org thread to check for an earlier post of $RELEASE_TAG, so posting it."
          elif [ "$seen" -gt 0 ]; then
            echo "::notice::$RELEASE_TAG is already in the discuss.flarum.org thread, so it is not posted again."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg content "$CONTENT" \
            --arg did "$DISCUSS_DISCUSSION_ID" \
            '{data:{type:"posts",attributes:{content:$content},relationships:{discussion:{data:{type:"discussions",id:$did}}}}}')

          # Several repos released together all reach Discuss at once: spread
          # them out a little before the first try.
          sleep $((RANDOM % 61))

          # Flarum throttles posting, and a burst of releases can meet a 429
          # more than once (Garage 1.2.2 gave up after one 35 s wait). Back off
          # 60, 120, 240 s, or what Retry-After asks (at most 240 s a wait),
          # and give up after about 8 minutes of waiting.
          waited=0
          for backoff in 60 120 240 0; do
            HTTP_CODE=$(curl -sS -D /tmp/discuss-headers.txt -o /tmp/discuss-resp.json -w '%{http_code}' \
              -X POST "${DISCUSS_URL%/}/api/posts" \
              -H "Authorization: Token ${DISCUSS_FLARUM_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            if [ "$HTTP_CODE" != "429" ] || [ "$backoff" = "0" ]; then break; fi
            after=$(tr -d '\r' < /tmp/discuss-headers.txt | awk -F': *' 'tolower($1) == "retry-after" { v = $2 } END { print v }')
            case "$after" in ''|*[!0-9]*) ;; *) backoff=$(( after < 1 ? 1 : (after > 240 ? 240 : after) )) ;; esac
            if [ $((waited + backoff)) -gt 480 ]; then break; fi
            echo "Throttled; trying again in $backoff seconds."
            sleep "$backoff"
            waited=$((waited + backoff))
          done

          echo "discuss.flarum.org responded with HTTP $HTTP_CODE"
          # Never the body: a summary, or the errors alone.
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            jq -c '{post: .data.id, number: .data.attributes.number, approved: .data.attributes.isApproved}' /tmp/discuss-resp.json 2>/dev/null || true
          else
            jq -c '[.errors[]? | {status, code, detail}]' /tmp/discuss-resp.json 2>/dev/null || echo "The response was not JSON."
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
